<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima Neón | OpenWeatherMap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">
    
    <h1 class="neon-title mb-4 text-center">
      <i class="fas fa-cloud-sun-rain me-2"></i> CLIMA NEÓN
    </h1>

    <div class="search-box panel p-3 mb-4 w-100" style="max-width: 480px;">
      <div class="input-group">
        <input type="text" id="cityInput" class="form-control form-control-lg neon-input" placeholder="Escribe una ciudad..." autocomplete="off">
        <button class="btn btn-neon" id="searchBtn" type="button">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <small class="text-muted d-block mt-2 text-center">Presiona Enter o haz clic en 🔍</small>
    </div>

    <div id="cardsContainer" class="row g-3 justify-content-center w-100" style="max-width: 1100px;"></div>
    <div id="message" class="mt-3 text-center"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
